[project]
name = "tundler-backend"
version = "0.1.0"
description = "Multi-tenant SaaS backend (FastAPI + Postgres)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.2",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "reportlab>=4.2.0",
]

[tool.uvicorn]

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
